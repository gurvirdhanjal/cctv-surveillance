# BoT-SORT tracker config — replaces bytetrack_custom.yaml
# Advantages over ByteTrack: camera motion compensation (CMC) + better occlusion handling
tracker_type: botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 90
match_thresh: 0.8
fuse_score: True
# CMC: sparse optical flow handles minor camera vibration on factory floor
cmc_method: sparseOptFlow
