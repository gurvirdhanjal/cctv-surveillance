# BoT-SORT tracker config for VMS — based on ultralytics 8.4.x defaults
# Advantages over ByteTrack: global motion compensation (GMC) for factory camera vibration
tracker_type: botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 90  # default; overridden at runtime by VMS_TRACKER_BUFFER_FRAMES
match_thresh: 0.8
fuse_score: True

# GMC: sparse optical flow handles minor factory-floor camera vibration
gmc_method: sparseOptFlow

# ReID model (disabled — we use OSNet body_embedder instead)
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
