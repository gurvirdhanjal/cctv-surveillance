[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vms"
version = "0.1.0"
description = "Video Management System with facial recognition and anomaly detection"
requires-python = ">=3.10"

[project.scripts]
vms-cli = "vms.cli.main:cli"

[project.optional-dependencies]
dev = ["moto[s3]>=5.0", "click>=8.1", "prometheus-client>=0.20"]

[project.dependencies]
# boto3 is a runtime dependency when storage_backend="minio"
# croniter, click, prometheus-client are runtime deps — install via pip

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["legacy/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["^legacy/"]

# These files use lazy optional imports (tensorflow, insightface) that may or
# may not be installed in any given environment. warn_unused_ignores would flip
# depending on whether the optional dep is present.
[[tool.mypy.overrides]]
module = ["vms.inference.violence", "vms.inference.detector"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast in-process tests (default)",
    "integration: requires real PostgreSQL/Redis",
    "heavy_models: loads PyTorch + TensorFlow simultaneously — run separately to avoid OOM",
]
# Exclude heavy_models from default pytest run (they crash if run with full suite due to
# PyTorch + TensorFlow coexisting in the same process on limited VRAM).
# Run them separately: pytest -m heavy_models
addopts = "-ra --strict-markers -m 'not heavy_models'"
