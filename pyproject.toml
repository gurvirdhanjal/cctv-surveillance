[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vms"
version = "0.1.0"
description = "Video Management System with facial recognition and anomaly detection"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["moto[s3]>=5.0"]

[project.dependencies]
# boto3 is a runtime dependency when storage_backend="minio"
# listed here for documentation; install via: pip install boto3

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["legacy/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["^legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast in-process tests (default)",
    "integration: requires real PostgreSQL/Redis",
]
addopts = "-ra --strict-markers"
